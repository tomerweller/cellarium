# The PR gate: every suite in every stack, with NO cross-stack path
# filtering — a circuit change must re-run the wallet vector gate and vice
# versa, because byte-exact cross-stack equivalence is the system's
# load-bearing invariant.
name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NARGO_VERSION: 1.0.0-beta.11

jobs:
  # Golden-vector drift + circuit tests (the two suites nothing gated before).
  circuits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: Cache nargo
        id: cache-nargo
        uses: actions/cache@v4
        with:
          path: ~/.nargo
          key: nargo-${{ env.NARGO_VERSION }}
      - name: Install nargo
        if: steps.cache-nargo.outputs.cache-hit != 'true'
        # Same pinned noirup commit as the Dockerfile.
        run: |
          curl -fsSL "https://raw.githubusercontent.com/noir-lang/noirup/c3bc9922bf7eeafdaba08fb6518776c4ba263a8c/install" -o /tmp/noirup.sh
          bash /tmp/noirup.sh
          ~/.nargo/bin/noirup -v $NARGO_VERSION
      - name: Vector drift gate
        run: bash scripts/check_vectors.sh
      - name: nargo test
        run: cd circuits && ~/.nargo/bin/nargo test

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy (warnings are errors; scoped allows live in-source)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests (every workspace package, incl. oracle and tUST)
        run: cargo test --workspace

  # Issues #44/#47: the deployed system serves plaintext DA and non-ZK
  # proofs, so user-facing copy must not promise confidentiality until the
  # redesign lands. Phrase-level guard; extend the list with any new claim
  # that gets corrected.
  privacy-claims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No privacy claims stronger than the deployed mode
        run: |
          if grep -RniE "private bilateral repo|cannot see who|nobody can see|terms (are|stay|remain) (hidden|secret|confidential)|fully private" \
              README.md DESIGN.md wallet/src wallet/index.html; then
            echo "::error::User-facing copy claims more privacy than the deployed non-ZK/plaintext-DA mode provides (issues #44/#47)."
            exit 1
          fi

  wallet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wallet/package-lock.json
      - run: npm ci
        working-directory: wallet
      - name: Crypto vector gate + unit tests
        run: npm test -- --run
        working-directory: wallet
      - name: Typecheck + build
        run: npm run build
        working-directory: wallet

name: sequencer-fly
on:
  push:
    branches: [main]
    paths:
      - 'sequencer/**'
      - 'harness/**'
      - 'contracts/**'
      - 'circuits/**'
      - 'Dockerfile'
      - 'fly.toml'
      - 'Cargo.*'
      - '.github/workflows/fly.yml'
  workflow_dispatch:

concurrency:
  group: fly-deploy
  cancel-in-progress: false

env:
  NARGO_VERSION: 1.0.0-beta.11
  BB_VERSION: 0.87.0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      # Fixture-based: real-proof verification runs without nargo/bb by design.
      - run: cargo test -p rollup -p harness -p sequencer

  # Issue #2: the rollup VK is contract-immutable, so an ordinary deploy must
  # prove the image's circuit VK matches the target contract before any
  # traffic switch. Circuit/VK changes go through the explicit re-bootstrap
  # workflow instead.
  vk-guard:
    # ubuntu-24.04: bb needs GLIBC >= 2.38.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Cache noir + bb toolchain
        id: cache-tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.nargo
            ~/.bb
          key: tools-${{ env.NARGO_VERSION }}-${{ env.BB_VERSION }}
      - name: Install nargo + bb (pinned, same commits as Dockerfile)
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          curl -fsSL "https://raw.githubusercontent.com/noir-lang/noirup/c3bc9922bf7eeafdaba08fb6518776c4ba263a8c/install" -o /tmp/noirup.sh
          bash /tmp/noirup.sh
          ~/.nargo/bin/noirup -v $NARGO_VERSION
          curl -fsSL "https://raw.githubusercontent.com/AztecProtocol/aztec-packages/073ea66ad92c53ebbf7be70d28973a68a8628942/barretenberg/bbup/install" -o /tmp/bbup.sh
          bash /tmp/bbup.sh
          ~/.bb/bbup -v $BB_VERSION
      - name: Install stellar CLI (same pin as Dockerfile)
        run: |
          curl -fsSL "https://github.com/stellar/stellar-cli/releases/download/v27.0.0/stellar-cli-27.0.0-x86_64-unknown-linux-gnu.tar.gz" \
            | sudo tar -xz -C /usr/local/bin stellar
      - name: Verify image VK against the live contract
        run: |
          export PATH="$HOME/.nargo/bin:$HOME/.bb:$PATH"
          bash scripts/check_vk.sh

  deploy:
    needs: [test, vk-guard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

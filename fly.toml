# Cellarium sequencer on Fly.io. Deploy with scripts/deploy_fly.sh (sets the
# SEQUENCER_SECRET, remote-builds).
#
# Self-bootstrapping: the container entrypoint (scripts/docker_entrypoint.sh,
# AUTO_BOOTSTRAP=1) keeps the instance compatible with the shipped code. On
# every boot it fingerprints the baked circuit's VK + the DB schema version
# against the instance recorded on the /data volume; on mismatch (circuit
# change, schema bump, or a blank volume) it deploys fresh tUST + oracle +
# rollup contracts, archives the old DB, and records the new ids — so a push
# to main that changes the circuit no longer needs a manual re-bootstrap.
# Contract ids therefore live on the volume (instance.env), NOT here; the
# wallet discovers them at runtime via GET /params.
#
# VM sizing is governed by the 5s-cadence requirement (docs/PROVING.md):
# bb prove(batch_repo) must stay ≤ ~3.5s so every Stellar ledger can carry a
# batch. performance-2x is the starting point; `fly scale vm performance-4x`
# is the knob if the benchmark gate misses.
app = "cellarium"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  RPC_URL = "https://soroban-testnet.stellar.org"
  NETWORK_PASSPHRASE = "Test SDF Network ; September 2015"
  AUTO_BOOTSTRAP = "1"
  # 5s-cadence batching: eager trigger reacts within one 2s tick; a lone
  # op waits at most 5s.
  BATCH_MAX_WAIT_SECS = "5"
  TICK_SECS = "2"
  CIRCUIT_PKG = "batch_repo"
  RUST_LOG = "sequencer=info"

[http_service]
  internal_port = 8080
  force_https = true
  # The batcher/deposit-watcher must run continuously — never autostop.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  # Readiness (not just liveness): /readyz verifies the engine thread,
  # chain sync, and watcher/batcher heartbeats, so a wedged background task
  # or unreachable chain fails the check (issue #10). Grace covers boot
  # reconciliation plus the first watcher/batcher pass.
  [[http_service.checks]]
    interval = "15s"
    timeout = "10s"
    # Self-bootstrap (fresh contract deploys + friendbot) can take a couple
    # of minutes on first boot after a circuit change — don't kill it early.
    grace_period = "180s"
    method = "get"
    path = "/readyz"

[[mounts]]
  source = "cellarium_data"
  destination = "/data"

[[vm]]
  # Dedicated cores per the 5s-cadence requirement (docs/PROVING.md §3.5):
  # shared CPUs throttle to a small baseline once burst credits drain, which
  # blows the proving budget under sustained load. performance-2x is ample
  # for batch_n4 (~1s prove).
  size = "performance-2x"
  memory = "4gb"

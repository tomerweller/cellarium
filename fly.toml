# Cellarium sequencer on Fly.io. Deploy with scripts/deploy_fly.sh (reads the
# bootstrap-generated .env, sets the secret, patches [env], remote-builds).
#
# VM sizing is governed by the 5s-cadence requirement (docs/PROVING.md):
# bb prove(batch_repo) must stay ≤ ~3.5s so every Stellar ledger can carry a
# batch. performance-2x is the starting point; `fly scale vm performance-4x`
# is the knob if the benchmark gate misses.
app = "cellarium"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  RPC_URL = "https://soroban-testnet.stellar.org"
  NETWORK_PASSPHRASE = "Test SDF Network ; September 2015"
  # Public identifiers, patched from .env by scripts/deploy_fly.sh.
  CONTRACT_ID = "CBCNLYJOYNSJQKWR75ANT5MACLRP27ATQ2X2XHT3JOIAB63WYVLZOSKJ"
  TOKEN_ID = "CDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC"
  TUST_ID = "CDZIWDNUZ7DQZMDUJSDO7MDF24RBKCLOPSDQJPGEKG3VL2U5GL3YND3K"
  ORACLE_ID = "CCCTIXDKKK2QM2DA4QRUKN5UA7P6Q36S3PI2HRE3UBSEVU2OMI4Y7TDP"
  SEQUENCER_ADDRESS = "GB5JFZJIVTKNBXNIUOZVNUGBOW4IHZRXFDGTBXIZDPXTOAZFSCV3QQSI"
  # 5s-cadence batching: eager trigger reacts within one 2s tick; a lone
  # op waits at most 5s.
  BATCH_MAX_WAIT_SECS = "5"
  TICK_SECS = "2"
  # Must match the VK the live contract was bootstrapped with — a circuit
  # change requires a re-bootstrap (the VK is contract-immutable) and a DB
  # reset.
  CIRCUIT_PKG = "batch_repo"
  RUST_LOG = "sequencer=info"

[http_service]
  internal_port = 8080
  force_https = true
  # The batcher/deposit-watcher must run continuously — never autostop.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "get"
    path = "/healthz"

[[mounts]]
  source = "cellarium_data"
  destination = "/data"

[[vm]]
  # Dedicated cores per the 5s-cadence requirement (docs/PROVING.md §3.5):
  # shared CPUs throttle to a small baseline once burst credits drain, which
  # blows the proving budget under sustained load. performance-2x is ample
  # for batch_n4 (~1s prove).
  size = "performance-2x"
  memory = "4gb"
